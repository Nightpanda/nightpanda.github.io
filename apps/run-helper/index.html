<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galloway Run/Walk Timer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1D4ED8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        button { user-select: none; -webkit-tap-highlight-color: transparent; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans select-none">

    <header class="p-4 bg-gray-800 flex justify-between items-center shadow-md border-b border-gray-700">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-blue-500">Galloway Engine</h1>
            <p id="spotifyStatus" class="text-xs text-gray-400">Spotify Disconnected</p>
        </div>
        <button id="spotifyBtn" class="bg-green-500 hover:bg-green-400 text-black text-xs font-bold py-2 px-4 rounded-full flex items-center transition-colors">
            Connect Spotify
        </button>
    </header>

    <main class="flex-grow p-4 flex flex-col justify-between max-w-md mx-auto w-full space-y-6">
        
        <div id="activeTimerSection" class="hidden flex-col items-center justify-center flex-grow space-y-6 py-12">
            <h2 id="currentPhase" class="text-6xl font-extrabold uppercase tracking-widest transition-all duration-300">READY</h2>
            <div id="timeRemaining" class="text-8xl font-mono font-bold tracking-tight tabular-nums">00:00</div>
            <div class="text-center">
                <p id="totalTimeElapsed" class="text-gray-400 text-xl font-medium">Total Execution: 00:00</p>
                <p id="upNextTrack" class="text-xs text-green-400 mt-2 italic font-mono"></p>
            </div>
            
            <div class="flex space-x-4 w-full pt-6">
                <button id="pauseBtn" class="flex-1 bg-yellow-600 hover:bg-yellow-500 py-4 rounded-xl font-bold text-xl shadow-md transition-colors">Pause</button>
                <button id="stopBtn" class="flex-1 bg-red-600 hover:bg-red-500 py-4 rounded-xl font-bold text-xl shadow-md transition-colors">Stop</button>
            </div>
        </div>

        <div id="setupSection" class="flex flex-col space-y-6 flex-grow justify-start">
            
            <section>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Quick Presets</h3>
                <div class="grid grid-cols-2 gap-2.5" id="presetContainer"></div>
            </section>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="flex-shrink-0 mx-4 text-gray-600 text-xs font-bold tracking-wider">OR CUSTOM SETTINGS</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <section class="grid grid-cols-2 gap-4">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col items-center">
                    <label class="text-xs font-bold text-green-400 uppercase tracking-wide mb-2">Run Target</label>
                    <div class="flex items-center space-x-1 font-mono">
                        <input type="number" id="manualRunMin" value="1" min="0" max="59" class="bg-gray-900 text-center text-2xl font-bold rounded p-1 w-12 border border-gray-600 focus:outline-none focus:border-green-400">
                        <span class="text-xl font-bold text-gray-500">:</span>
                        <input type="number" id="manualRunSec" value="00" min="0" max="59" class="bg-gray-900 text-center text-2xl font-bold rounded p-1 w-12 border border-gray-600 focus:outline-none focus:border-green-400">
                    </div>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col items-center">
                    <label class="text-xs font-bold text-blue-400 uppercase tracking-wide mb-2">Walk Target</label>
                    <div class="flex items-center space-x-1 font-mono">
                        <input type="number" id="manualWalkMin" value="1" min="0" max="59" class="bg-gray-900 text-center text-2xl font-bold rounded p-1 w-12 border border-gray-600 focus:outline-none focus:border-blue-400">
                        <span class="text-xl font-bold text-gray-500">:</span>
                        <input type="number" id="manualWalkSec" value="00" min="0" max="59" class="bg-gray-900 text-center text-2xl font-bold rounded p-1 w-12 border border-gray-600 focus:outline-none focus:border-blue-400">
                    </div>
                </div>
            </section>

            <section class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wide">Target Music Cadence</label>
                    <p class="text-xs text-gray-500">Auto-injects to playlist query</p>
                </div>
                <div class="flex items-center space-x-2 font-mono">
                    <input type="number" id="spotifyBpm" value="165" min="60" max="220" class="bg-gray-900 text-center text-xl font-bold rounded p-2 w-20 border border-gray-600 focus:outline-none focus:border-green-500 text-green-400">
                    <span class="font-bold text-sm text-gray-400">BPM</span>
                </div>
            </section>

            <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl text-xl mt-auto shadow-lg transition-all transform active:scale-98">
                START WORKOUT
            </button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
