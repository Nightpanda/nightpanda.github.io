<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Minimal%20Workout%20Runner%22,%22short_name%22:%22Workout%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23020617%22,%22theme_color%22:%22%23020617%22}">

  <title>Minimal Workout Runner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --card: #0f172a;
      --panel: #111c31;
      --button: #1e293b;
      --muted: #94a3b8;
      --blue: #0284c7;
      --green-bg: #041f18;
      --green-btn: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      cursor: pointer;
      transition: transform .08s ease, opacity .08s ease, background-color .15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(.95);
      opacity: .85;
    }

    .wrap {
      width: min(100%, 560px);
      margin: auto;
      padding: 20px 14px calc(28px + env(safe-area-inset-bottom));
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      margin: 14px 0;
      transition: opacity .2s ease, background .2s ease;
    }

    .card.done {
      background: var(--green-bg);
      outline: 1px solid #0e5a38;
      opacity: .65;
    }

    .card.done h2 {
      color: #a7f3d0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #0369a1;
      color: #e0f2fe;
      font-size: 11px;
      font-weight: 800;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .eyebrow {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0;
      font-size: clamp(38px, 11vw, 58px);
      line-height: 1;
    }

    h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
    }

    p {
      color: var(--muted);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .top-right {
      text-align: right;
    }

    .block {
      color: #64748b;
      font-size: 14px;
    }

    .rest-timer {
      font-size: 12px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: .05em;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .sub-target {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .target {
      display: inline-block;
      padding: 6px 11px;
      background: var(--button);
      border-radius: 999px;
      color: #cbd5e1;
      font-weight: 700;
      font-size: 14px;
    }

    .last-summary {
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .weight {
      margin-top: 18px;
      padding: 14px;
      background: #081224;
      border-radius: 18px;
    }

    .readout {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .readout strong,
    .rep-readout strong,
    .pill {
      font-variant-numeric: tabular-nums;
    }

    .readout strong {
      font-size: 32px;
    }

    .readout span {
      margin-left: 8px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
    }

    .warmup-btn {
      position: absolute;
      right: 0;
      background: transparent;
      border: 1px solid #334155;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .warmup-panel {
      background: #0b1528;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #1e293b;
    }

    .warmup-title {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .warmup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 6px;
    }

    .warmup-item {
      background: #111c31;
      padding: 6px 8px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .weight-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 13px;
    }

    .weight-step {
      display: grid;
      gap: 7px;
    }

    .weight-step button,
    .rep-step button {
      min-height: 60px;
      border: 0;
      border-radius: 15px;
      background: var(--button);
      color: #fff;
      font-size: 31px;
      font-weight: 850;
    }

    .weight-step span {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .rep-step {
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      gap: 10px;
      margin-top: 15px;
    }

    .rep-readout {
      min-height: 64px;
      background: var(--panel);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .rep-readout strong {
      font-size: 29px;
    }

    .rep-readout span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .sets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 34px;
      margin: 15px 0;
    }

    .pill {
      background: var(--button);
      color: #cbd5e1;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 14px;
    }

    .pill.undoable {
      cursor: pointer;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
    }

    .pill.undoable:active {
      transform: scale(0.92);
      opacity: 0.8;
    }

    .primary,
    .record,
    .next,
    .secondary {
      width: 100%;
      border: 0;
      border-radius: 17px;
      font-weight: 850;
    }

    .primary,
    .next {
      min-height: 62px;
      background: #fff;
      color: #020617;
      font-size: 19px;
    }

    .next {
      position: sticky;
      bottom: calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 12px 32px rgba(0, 0, 0, .6);
      z-index: 10;
    }

    .record {
      min-height: 58px;
      background: var(--blue);
      color: #fff;
      font-size: 18px;
    }

    .record.hit-max {
      background: var(--green-btn);
    }

    .secondary {
      min-height: 48px;
      margin-top: 10px;
      background: #172033;
      color: #cbd5e1;
    }

    .next:disabled {
      opacity: .28;
      cursor: default;
      box-shadow: none;
    }

    .finish {
      text-align: center;
      padding-top: 24vh;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-group .secondary {
      margin-top: 0;
    }

    @media(max-width:370px) {
      .weight-grid {
        gap: 5px;
      }

      .weight-step button {
        min-height: 54px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <input type="file" id="import-input" accept="application/json" style="display:none" onchange="importJSON(event)">

  <script>
    const PROGRAM = [
      {
        id: 'A', blocks: [
          { type: 'single', exercises: [{ name: 'Conventional Deadlift', weight: 90, unit: 'kg', sets: 2, min: 4, max: 6 }] },
          { type: 'superset', exercises: [{ name: 'Incline Dumbbell Press', weight: 20, unit: 'kg', sets: 3, min: 6, max: 10 }, { name: 'Chest-Supported Row', weight: 40, unit: 'kg', sets: 3, min: 6, max: 10 }] },
          { type: 'superset', exercises: [{ name: 'Supported Split Squat', weight: 10, unit: 'kg', sets: 2, min: 8, max: 12 }, { name: 'Leg Curl', weight: 30, unit: 'kg', sets: 2, min: 8, max: 15 }] },
          { type: 'single', exercises: [{ name: 'Calf Raise', weight: 40, unit: 'kg', sets: 2, min: 10, max: 15 }] }
        ]
      },
      {
        id: 'B', blocks: [
          { type: 'single', exercises: [{ name: 'Machine Hack Squat', weight: 90, unit: 'kg', sets: 3, min: 6, max: 10 }] },
          { type: 'superset', exercises: [{ name: 'Pull-Up', weight: 0, unit: 'kg added', sets: 3, min: 6, max: 10 }, { name: 'One-Arm Landmine Press', weight: 20, unit: 'kg', sets: 3, min: 6, max: 10 }] },
          { type: 'single', exercises: [{ name: 'Romanian Deadlift', weight: 60, unit: 'kg', sets: 2, min: 6, max: 10 }] },
          { type: 'superset', exercises: [{ name: 'Leg Extension', weight: 40, unit: 'kg', sets: 2, min: 10, max: 15 }, { name: 'Cable Anti-Rotation Press', weight: 15, unit: 'kg', sets: 2, min: 8, max: 12 }] }
        ]
      },
      {
        id: 'C', blocks: [
          { type: 'single', exercises: [{ name: 'Leg Press', weight: 100, unit: 'kg', sets: 3, min: 8, max: 12 }] },
          { type: 'superset', exercises: [{ name: 'Machine Chest Press', weight: 40, unit: 'kg', sets: 3, min: 6, max: 10 }, { name: 'One-Arm Cable Row', weight: 30, unit: 'kg', sets: 3, min: 8, max: 12 }] },
          { type: 'superset', exercises: [{ name: 'Pull-Up', weight: 0, unit: 'kg added', sets: 2, min: 6, max: 10 }, { name: 'Leg Curl', weight: 30, unit: 'kg', sets: 2, min: 8, max: 15 }] },
          { type: 'single', exercises: [{ name: 'Lateral Raise', weight: 10, unit: 'kg', sets: 2, min: 10, max: 20 }] }
        ]
      }
    ];
    const STEPS = [0.5, 1.25, 2.5, 5], KEY = 'minimal-workout-runner-v4';
    let state = load();
    let timerInterval = null;

    function vibrate(ms = 25) {
      if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { next: 0, active: null, logs: [] } } catch { return { next: 0, active: null, logs: [] } } }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)) }

    function getProgression(workoutId, exercise) {
      const lastLog = [...state.logs].reverse().find(l => l.workoutId === workoutId);
      if (!lastLog) return { weight: exercise.weight, leveledUp: false };

      let lastData = null;
      for (const block of lastLog.results) {
        const found = block.find(e => e.name === exercise.name);
        if (found && found.sets && found.sets.length > 0) {
          lastData = found;
          break;
        }
      }

      if (!lastData) return { weight: exercise.weight, leveledUp: false };

      const sets = lastData.sets;
      const lastWeight = sets[sets.length - 1].weight;

      const completedAllSets = sets.length >= exercise.sets;
      const hitMaxReps = sets.every(s => s.reps >= exercise.max);

      if (completedAllSets && hitMaxReps) {
        const smallStep = exercise.max >= 15 || /dumbbell|lateral|anti-rotation/i.test(exercise.name);
        const step = smallStep ? 1.25 : 2.5;
        const nextWeight = Math.round((lastWeight + step) * 100) / 100;
        return { weight: nextWeight, leveledUp: true };
      }

      return { weight: lastWeight, leveledUp: false };
    }

    function getLastSessionSummary(workoutId, exerciseName) {
      const lastLog = [...state.logs].reverse().find(l => l.workoutId === workoutId);
      if (!lastLog) return null;
      for (const block of lastLog.results) {
        const found = block.find(e => e.name === exerciseName);
        if (found && found.sets && found.sets.length > 0) {
          const repsList = found.sets.map(s => s.reps).join(', ');
          const weight = found.sets[0].weight;
          const unit = found.sets[0].unit || 'kg';
          return `${fmt(weight)} ${unit} × [${repsList}]`;
        }
      }
      return null;
    }

    function getWarmupSets(targetWeight) {
      if (targetWeight <= 0) return [{ weight: 0, reps: 10 }];
      const sets = [];
      if (targetWeight > 20) {
        sets.push({ weight: 20, reps: 10 });
      }
      const p50 = Math.round((targetWeight * 0.5) / 2.5) * 2.5;
      const p75 = Math.round((targetWeight * 0.75) / 2.5) * 2.5;
      const p90 = Math.round((targetWeight * 0.9) / 2.5) * 2.5;

      if (p50 > 20 && p50 < targetWeight) sets.push({ weight: p50, reps: 5 });
      if (p75 > p50 && p75 < targetWeight) sets.push({ weight: p75, reps: 3 });
      if (p90 > p75 && p90 < targetWeight) sets.push({ weight: p90, reps: 1 });

      if (sets.length === 0) {
        sets.push({ weight: Math.round(targetWeight * 0.5 * 10) / 10, reps: 5 });
      }
      return sets;
    }

    function makeActive(i) {
      const workout = PROGRAM[i];
      return {
        workoutIndex: i,
        startedAt: new Date().toISOString(),
        lastSetAt: new Date().toISOString(),
        showWarmup: {},
        block: 0,
        results: workout.blocks.map(b =>
          b.exercises.map(e => {
            const prog = getProgression(workout.id, e);
            return {
              name: e.name,
              weight: prog.weight,
              unit: e.unit,
              reps: e.min,
              sets: [],
              leveledUp: prog.leveledUp
            };
          })
        )
      };
    }

    function fmt(n) { return Number(Number(n).toFixed(2)).toString() }
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

    function updateRestTimer() {
      const el = document.getElementById('rest-timer');
      if (!el || !state.active || !state.active.lastSetAt) return;
      const diff = Math.max(0, Math.floor((Date.now() - new Date(state.active.lastSetAt).getTime()) / 1000));
      const m = Math.floor(diff / 60);
      const s = (diff % 60).toString().padStart(2, '0');
      el.textContent = `Rest ${m}:${s}`;
    }

    function render() {
      const app = document.getElementById('app');
      if (state.finished) {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        app.innerHTML = `<main class="wrap finish"><div class="eyebrow">Workout complete</div><h1>Get out of the gym.</h1><p>Next time: Workout ${PROGRAM[state.next].id}</p><button class="primary" onclick="dismiss()">Done</button></main>`;
        return;
      }
      if (!state.active) {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        const w = PROGRAM[state.next];
        app.innerHTML = `<main class="wrap"><section class="card"><div class="eyebrow">Next</div><h1>Workout ${w.id}</h1><p>Follow the screen. Record working sets only.</p><button class="primary" onclick="start()">Start workout</button><div class="btn-group"><button class="secondary" onclick="exportJSON()">Export JSON</button><button class="secondary" onclick="triggerImport()">Import JSON</button></div></section></main>`;
        return;
      }

      const a = state.active, w = PROGRAM[a.workoutIndex], b = w.blocks[a.block], r = a.results[a.block], complete = b.exercises.every((e, i) => r[i].sets.length >= e.sets);
      app.innerHTML = `<main class="wrap"><header class="top"><div><div class="eyebrow">Workout ${w.id}</div><h2>${b.type === 'superset' ? 'Superset' : 'Current exercise'}</h2></div><div class="top-right"><div class="block">Block ${a.block + 1}/${w.blocks.length}</div><div id="rest-timer" class="rest-timer">Rest 0:00</div></div></header>${b.exercises.map((e, i) => card(e, r[i], i)).join('')}<button class="next" ${complete ? '' : 'disabled'} onclick="advance()">${a.block === w.blocks.length - 1 ? 'Finish workout' : 'Next exercise'}</button></main>`;

      if (!timerInterval) {
        timerInterval = setInterval(updateRestTimer, 1000);
      }
      setTimeout(updateRestTimer, 0);
    }

    function card(e, r, i) {
      const done = r.sets.length >= e.sets, n = Math.min(r.sets.length + 1, e.sets);
      const isMaxHit = r.reps >= e.max;
      const lastSummary = getLastSessionSummary(PROGRAM[state.active.workoutIndex].id, e.name);
      const showW = state.active.showWarmup && state.active.showWarmup[i];

      return `<section class="card ${done ? 'done' : ''}">
        <div class="card-header">
          <h2>${esc(e.name)}</h2>
          ${r.leveledUp ? '<span class="badge">Weight ↑</span>' : ''}
        </div>
        <div class="sub-target">
          <span class="target">${e.sets} × ${e.min}–${e.max}</span>
          ${lastSummary ? `<span class="last-summary">Last: ${lastSummary}</span>` : ''}
        </div>
        <div class="weight">
          <div class="readout">
            <strong>${fmt(r.weight)}</strong><span>${esc(r.unit)}</span>
            <button class="warmup-btn" onclick="toggleWarmup(${i})">${showW ? 'Close Warm-up' : '🔥 Warm-up'}</button>
          </div>
          ${showW ? `
            <div class="warmup-panel">
              <div class="warmup-title">Warm-Up Protocol</div>
              <div class="warmup-grid">
                ${getWarmupSets(r.weight).map(w => `
                  <div class="warmup-item">
                    <strong>${fmt(w.weight)}</strong> ${esc(r.unit)}<br>
                    <span style="color:var(--muted); font-size:11px;">× ${w.reps} reps</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          <div class="weight-grid">${STEPS.map(s => `<div class="weight-step"><button ${done ? 'disabled' : ''} aria-label="Decrease by ${s} kg" onclick="weight(${i},-${s})">−</button><span>${s} kg</span><button ${done ? 'disabled' : ''} aria-label="Increase by ${s} kg" onclick="weight(${i},${s})">+</button></div>`).join('')}</div>
        </div>
        <div class="rep-step">
          <button ${done ? 'disabled' : ''} onclick="reps(${i},-1)">−</button>
          <div class="rep-readout"><strong>${r.reps}</strong><span>${done ? 'complete' : `set ${n} reps`}</span></div>
          <button ${done ? 'disabled' : ''} onclick="reps(${i},1)">+</button>
        </div>
        <div class="sets">${r.sets.map((s, idx) => {
          const isLast = idx === r.sets.length - 1;
          return `<span class="pill ${isLast && !done ? 'undoable' : ''}" ${isLast && !done ? `onclick="undo(${i})" title="Tap to remove set"` : ''}>${fmt(s.weight)} × ${s.reps}${isLast && !done ? ' ✕' : ''}</span>`;
        }).join('')}</div>
        <button class="record ${isMaxHit ? 'hit-max' : ''}" ${done ? 'disabled' : ''} onclick="record(${i})">${done ? 'Exercise complete' : `Record set ${n} ${isMaxHit ? '✓' : ''}`}</button>
      </section>`;
    }

    function toggleWarmup(i) {
      vibrate(15);
      if (!state.active.showWarmup) state.active.showWarmup = {};
      state.active.showWarmup[i] = !state.active.showWarmup[i];
      save();
      render();
    }

    function start() { vibrate(30); state.active = makeActive(state.next); save(); render(); }
    function weight(i, d) { vibrate(20); const r = state.active.results[state.active.block][i]; r.weight = Math.max(0, Math.round((r.weight + d) * 100) / 100); save(); render(); }
    function reps(i, d) { vibrate(20); const r = state.active.results[state.active.block][i]; r.reps = Math.max(0, r.reps + d); save(); render(); }

    function record(i) {
      vibrate(40);
      const a = state.active, e = PROGRAM[a.workoutIndex].blocks[a.block].exercises[i], r = a.results[a.block][i];
      if (r.sets.length >= e.sets) return;
      r.sets.push({ set: r.sets.length + 1, weight: r.weight, unit: r.unit, reps: r.reps, recordedAt: new Date().toISOString() });
      a.lastSetAt = new Date().toISOString();
      save();
      render();
    }

    function undo(i) {
      vibrate(25);
      const a = state.active, r = a.results[a.block][i];
      if (r.sets.length > 0) {
        r.sets.pop();
        save();
        render();
      }
    }

    function advance() {
      vibrate(45);
      const a = state.active, w = PROGRAM[a.workoutIndex], b = w.blocks[a.block];
      if (!b.exercises.every((e, i) => a.results[a.block][i].sets.length >= e.sets)) return;
      if (a.block < w.blocks.length - 1) {
        a.block++;
        save();
        render();
        return;
      }
      state.logs.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), workoutId: w.id, startedAt: a.startedAt, completedAt: new Date().toISOString(), results: a.results });
      state.next = (a.workoutIndex + 1) % PROGRAM.length;
      state.active = null;
      state.finished = true;
      save();
      render();
    }

    function dismiss() { vibrate(20); state.finished = false; save(); render(); }

    function exportJSON() {
      const data = { schemaVersion: 1, exportedAt: new Date().toISOString(), program: PROGRAM, next: state.next, sessions: state.logs };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `workout-log-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function triggerImport() { document.getElementById('import-input').click(); }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        try {
          const data = JSON.parse(evt.target.result);
          const sessions = data.sessions || data.logs;

          if (!Array.isArray(sessions)) {
            alert('Invalid file format. Could not find workout logs.');
            return;
          }

          state.logs = sessions;

          if (typeof data.next === 'number') {
            state.next = data.next % PROGRAM.length;
          } else if (state.logs.length > 0) {
            const lastLog = state.logs[state.logs.length - 1];
            const lastIdx = PROGRAM.findIndex(p => p.id === lastLog.workoutId);
            state.next = lastIdx !== -1 ? (lastIdx + 1) % PROGRAM.length : 0;
          } else {
            state.next = 0;
          }

          state.active = null;
          state.finished = false;

          save();
          render();
          alert(`Successfully imported ${state.logs.length} workout session(s)!`);
        } catch (err) {
          alert('Failed to parse JSON file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    render();
  </script>
</body>
